name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_agents:
        description: 'Force rebuild agents even if no agent files changed'
        type: boolean
        default: false
      force_shell:
        description: 'Force rebuild shell even if no shell files changed'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  RESOURCE_GROUP: coaching-platform-v2-rg
  LOCATION: centralus

jobs:
  # ---- Detect which paths changed ----
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      agents: ${{ steps.filter.outputs.agents }}
      shell:  ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            agents:
              - 'packages/agents/**'
              - 'packages/sdk/**'
              - 'packages/tools/**'
              - 'packages/skills/**'
              - 'Dockerfile.agent'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
            shell:
              - 'shell/**'
              - 'packages/sdk/**'
              - 'packages/tools/**'
              - 'packages/skills/**'
              - 'shell/Dockerfile'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'

  # ---- Deploy Bicep infrastructure (idempotent) ----
  deploy-infra:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.agents == 'true' || needs.changes.outputs.shell == 'true' || github.event.inputs.force_agents == 'true' || github.event.inputs.force_shell == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep infrastructure
        run: |
          az deployment sub create \
            --location ${{ env.LOCATION }} \
            --template-file azure/main.bicep \
            --parameters \
              environment=prod \
              location=${{ env.LOCATION }} \
              projectName=coaching-platform

  # ---- Seed secrets into both Container Apps ----
  seed-secrets:
    runs-on: ubuntu-latest
    needs: deploy-infra
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Seed secrets into coachprod-multi
        run: |
          az containerapp secret set \
            --name coachprod-multi \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              "supabase-url=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              "supabase-anon-key=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
              "supabase-service-role-key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              "shell-internal-token=${{ secrets.SHELL_INTERNAL_TOKEN }}" \
              "llm-provider=${{ secrets.LLM_PROVIDER }}" \
              "azure-openai-endpoint=${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
              "azure-openai-api-key=${{ secrets.AZURE_OPENAI_API_KEY }}" \
              "azure-openai-deployment=${{ secrets.AZURE_OPENAI_DEPLOYMENT }}" \
              "azure-openai-embedding-deployment=${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}" \
              "gemini-api-key=${{ secrets.GEMINI_API_KEY }}" \
              "youtube-api-key=${{ secrets.YOUTUBE_API_KEY }}" \
              "pinecone-api-key=${{ secrets.PINECONE_API_KEY }}" \
              "pinecone-index=${{ secrets.PINECONE_INDEX }}" \
              "resend-api-key=${{ secrets.RESEND_API_KEY }}" \
              "from-email=${{ secrets.FROM_EMAIL }}" \
              "platform-domain=${{ secrets.PLATFORM_DOMAIN }}" \
              "platform-cut-pct=${{ secrets.PLATFORM_CUT_PCT }}" \
              "stripe-secret-key=${{ secrets.STRIPE_SECRET_KEY }}" \
              "stripe-publishable-key=${{ secrets.STRIPE_PUBLISHABLE_KEY }}" \
              "stripe-webhook-secret=${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
              "razorpay-key-id=${{ secrets.RAZORPAY_KEY_ID }}" \
              "razorpay-key-secret=${{ secrets.RAZORPAY_KEY_SECRET }}" \
              "razorpay-webhook-secret=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" \
              "google-client-id=${{ secrets.GOOGLE_CLIENT_ID }}" \
              "google-client-secret=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              "google-redirect-uri=${{ secrets.GOOGLE_REDIRECT_URI }}" \
              "gmail-redirect-uri=${{ secrets.GMAIL_REDIRECT_URI }}" \
              "ghcr-password=${{ secrets.GITHUB_TOKEN }}"

      - name: Seed secrets into coachprod-shell
        run: |
          az containerapp secret set \
            --name coachprod-shell \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              "supabase-url=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              "supabase-anon-key=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
              "supabase-service-role-key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              "shell-internal-token=${{ secrets.SHELL_INTERNAL_TOKEN }}" \
              "llm-provider=${{ secrets.LLM_PROVIDER }}" \
              "azure-openai-endpoint=${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
              "azure-openai-api-key=${{ secrets.AZURE_OPENAI_API_KEY }}" \
              "azure-openai-deployment=${{ secrets.AZURE_OPENAI_DEPLOYMENT }}" \
              "azure-openai-embedding-deployment=${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}" \
              "gemini-api-key=${{ secrets.GEMINI_API_KEY }}" \
              "youtube-api-key=${{ secrets.YOUTUBE_API_KEY }}" \
              "pinecone-api-key=${{ secrets.PINECONE_API_KEY }}" \
              "pinecone-index=${{ secrets.PINECONE_INDEX }}" \
              "resend-api-key=${{ secrets.RESEND_API_KEY }}" \
              "from-email=${{ secrets.FROM_EMAIL }}" \
              "platform-domain=${{ secrets.PLATFORM_DOMAIN }}" \
              "platform-cut-pct=${{ secrets.PLATFORM_CUT_PCT }}" \
              "stripe-secret-key=${{ secrets.STRIPE_SECRET_KEY }}" \
              "stripe-publishable-key=${{ secrets.STRIPE_PUBLISHABLE_KEY }}" \
              "stripe-webhook-secret=${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
              "razorpay-key-id=${{ secrets.RAZORPAY_KEY_ID }}" \
              "razorpay-key-secret=${{ secrets.RAZORPAY_KEY_SECRET }}" \
              "razorpay-webhook-secret=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" \
              "google-client-id=${{ secrets.GOOGLE_CLIENT_ID }}" \
              "google-client-secret=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              "google-redirect-uri=${{ secrets.GOOGLE_REDIRECT_URI }}" \
              "gmail-redirect-uri=${{ secrets.GMAIL_REDIRECT_URI }}" \
              "ghcr-password=${{ secrets.GITHUB_TOKEN }}"

  # ---- Build and deploy multi-agent container ----
  deploy-agents:
    runs-on: ubuntu-latest
    needs: [changes, seed-secrets]
    if: needs.changes.outputs.agents == 'true' || github.event.inputs.force_agents == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-agent image
        run: |
          SHA="${{ github.sha }}"
          docker build \
            --build-arg AGENT_MODE=multi \
            -f Dockerfile.agent \
            -t ${{ env.REGISTRY }}/coaching-multi-agent:latest \
            -t ${{ env.REGISTRY }}/coaching-multi-agent:$SHA \
            .
          docker push ${{ env.REGISTRY }}/coaching-multi-agent:latest
          docker push ${{ env.REGISTRY }}/coaching-multi-agent:$SHA

      - name: Update multi-agent Container App
        run: |
          az containerapp update \
            --name coachprod-multi \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/coaching-multi-agent:latest

  # ---- Build and deploy shell ----
  deploy-shell:
    runs-on: ubuntu-latest
    needs: [changes, seed-secrets]
    if: needs.changes.outputs.shell == 'true' || github.event.inputs.force_shell == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push shell image
        run: |
          SHA="${{ github.sha }}"
          docker build \
            -t ${{ env.REGISTRY }}/shell:latest \
            -t ${{ env.REGISTRY }}/shell:$SHA \
            -f shell/Dockerfile \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            --build-arg PLATFORM_DOMAIN=${{ secrets.PLATFORM_DOMAIN }} \
            .
          docker push ${{ env.REGISTRY }}/shell:latest
          docker push ${{ env.REGISTRY }}/shell:$SHA

      - name: Get multi-agent FQDN
        id: multi-agent
        run: |
          fqdn=$(az containerapp show \
            --name coachprod-multi \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query 'properties.configuration.ingress.fqdn' -o tsv 2>/dev/null || echo "")
          echo "fqdn=$fqdn" >> $GITHUB_OUTPUT

      - name: Update shell Container App
        run: |
          SHA="${{ github.sha }}"
          MULTI_AGENT_URL=""
          if [ -n "${{ steps.multi-agent.outputs.fqdn }}" ]; then
            MULTI_AGENT_URL="https://${{ steps.multi-agent.outputs.fqdn }}"
          fi
          az containerapp update \
            --name coachprod-shell \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/shell:$SHA \
            --set-env-vars \
              "MULTI_AGENT_MODE=true" \
              "MULTI_AGENT_BASE_URL=$MULTI_AGENT_URL"
