name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_agents:
        description: 'Force rebuild agents even if no agent files changed'
        type: boolean
        default: false
      force_shell:
        description: 'Force rebuild shell even if no shell files changed'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  RESOURCE_GROUP: coaching-platform-v2-rg
  LOCATION: centralus

jobs:
  # ---- Detect which paths changed ----
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      agents: ${{ steps.filter.outputs.agents }}
      shell:  ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            agents:
              - 'packages/agents/**'
              - 'packages/sdk/**'
              - 'packages/tools/**'
              - 'packages/skills/**'
              - 'Dockerfile.agent'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
            shell:
              - 'shell/**'
              - 'packages/sdk/**'
              - 'packages/tools/**'
              - 'packages/skills/**'
              - 'shell/Dockerfile'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'

  # ---- Deploy Bicep infrastructure (idempotent) ----
  deploy-infra:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.agents == 'true' || needs.changes.outputs.shell == 'true' || github.event.inputs.force_agents == 'true' || github.event.inputs.force_shell == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep infrastructure
        run: |
          az deployment sub create \
            --location ${{ env.LOCATION }} \
            --template-file azure/main.bicep \
            --parameters \
              environment=prod \
              location=${{ env.LOCATION }} \
              projectName=coaching-platform

  # ---- Seed secrets into both Container Apps ----
  seed-secrets:
    runs-on: ubuntu-latest
    needs: deploy-infra
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Seed secrets into coachprod-multi
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHELL_INTERNAL_TOKEN: ${{ secrets.SHELL_INTERNAL_TOKEN }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          PLATFORM_DOMAIN: ${{ secrets.PLATFORM_DOMAIN }}
          PLATFORM_CUT_PCT: ${{ secrets.PLATFORM_CUT_PCT }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          GMAIL_REDIRECT_URI: ${{ secrets.GMAIL_REDIRECT_URI }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build list of non-empty secrets only — az CLI rejects empty values
          SECRETS=()
          add_secret() { [ -n "$2" ] && SECRETS+=("$1=$2") || true; }
          add_secret "supabase-url"                    "$SUPABASE_URL"
          add_secret "supabase-anon-key"               "$SUPABASE_ANON_KEY"
          add_secret "supabase-service-role-key"       "$SUPABASE_SERVICE_ROLE_KEY"
          add_secret "shell-internal-token"            "$SHELL_INTERNAL_TOKEN"
          add_secret "llm-provider"                    "$LLM_PROVIDER"
          add_secret "azure-openai-endpoint"           "$AZURE_OPENAI_ENDPOINT"
          add_secret "azure-openai-api-key"            "$AZURE_OPENAI_API_KEY"
          add_secret "azure-openai-deployment"         "$AZURE_OPENAI_DEPLOYMENT"
          add_secret "azure-openai-embedding-deployment" "$AZURE_OPENAI_EMBEDDING_DEPLOYMENT"
          add_secret "gemini-api-key"                  "$GEMINI_API_KEY"
          add_secret "youtube-api-key"                 "$YOUTUBE_API_KEY"
          add_secret "pinecone-api-key"                "$PINECONE_API_KEY"
          add_secret "pinecone-index"                  "$PINECONE_INDEX"
          add_secret "resend-api-key"                  "$RESEND_API_KEY"
          add_secret "from-email"                      "$FROM_EMAIL"
          add_secret "platform-domain"                 "$PLATFORM_DOMAIN"
          add_secret "platform-cut-pct"                "$PLATFORM_CUT_PCT"
          add_secret "stripe-secret-key"               "$STRIPE_SECRET_KEY"
          add_secret "stripe-publishable-key"          "$STRIPE_PUBLISHABLE_KEY"
          add_secret "stripe-webhook-secret"           "$STRIPE_WEBHOOK_SECRET"
          add_secret "razorpay-key-id"                 "$RAZORPAY_KEY_ID"
          add_secret "razorpay-key-secret"             "$RAZORPAY_KEY_SECRET"
          add_secret "razorpay-webhook-secret"         "$RAZORPAY_WEBHOOK_SECRET"
          add_secret "google-client-id"                "$GOOGLE_CLIENT_ID"
          add_secret "google-client-secret"            "$GOOGLE_CLIENT_SECRET"
          add_secret "google-redirect-uri"             "$GOOGLE_REDIRECT_URI"
          add_secret "gmail-redirect-uri"              "$GMAIL_REDIRECT_URI"
          add_secret "ghcr-password"                   "$GHCR_PASSWORD"
          if [ ${#SECRETS[@]} -eq 0 ]; then
            echo "No secrets to seed into coachprod-multi, skipping."
          else
            az containerapp secret set \
              --name coachprod-multi \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --secrets "${SECRETS[@]}"
          fi

      - name: Seed secrets into coachprod-shell
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHELL_INTERNAL_TOKEN: ${{ secrets.SHELL_INTERNAL_TOKEN }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          PLATFORM_DOMAIN: ${{ secrets.PLATFORM_DOMAIN }}
          PLATFORM_CUT_PCT: ${{ secrets.PLATFORM_CUT_PCT }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          GMAIL_REDIRECT_URI: ${{ secrets.GMAIL_REDIRECT_URI }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SECRETS=()
          add_secret() { [ -n "$2" ] && SECRETS+=("$1=$2") || true; }
          add_secret "supabase-url"                    "$SUPABASE_URL"
          add_secret "supabase-anon-key"               "$SUPABASE_ANON_KEY"
          add_secret "supabase-service-role-key"       "$SUPABASE_SERVICE_ROLE_KEY"
          add_secret "shell-internal-token"            "$SHELL_INTERNAL_TOKEN"
          add_secret "llm-provider"                    "$LLM_PROVIDER"
          add_secret "azure-openai-endpoint"           "$AZURE_OPENAI_ENDPOINT"
          add_secret "azure-openai-api-key"            "$AZURE_OPENAI_API_KEY"
          add_secret "azure-openai-deployment"         "$AZURE_OPENAI_DEPLOYMENT"
          add_secret "azure-openai-embedding-deployment" "$AZURE_OPENAI_EMBEDDING_DEPLOYMENT"
          add_secret "gemini-api-key"                  "$GEMINI_API_KEY"
          add_secret "youtube-api-key"                 "$YOUTUBE_API_KEY"
          add_secret "pinecone-api-key"                "$PINECONE_API_KEY"
          add_secret "pinecone-index"                  "$PINECONE_INDEX"
          add_secret "resend-api-key"                  "$RESEND_API_KEY"
          add_secret "from-email"                      "$FROM_EMAIL"
          add_secret "platform-domain"                 "$PLATFORM_DOMAIN"
          add_secret "platform-cut-pct"                "$PLATFORM_CUT_PCT"
          add_secret "stripe-secret-key"               "$STRIPE_SECRET_KEY"
          add_secret "stripe-publishable-key"          "$STRIPE_PUBLISHABLE_KEY"
          add_secret "stripe-webhook-secret"           "$STRIPE_WEBHOOK_SECRET"
          add_secret "razorpay-key-id"                 "$RAZORPAY_KEY_ID"
          add_secret "razorpay-key-secret"             "$RAZORPAY_KEY_SECRET"
          add_secret "razorpay-webhook-secret"         "$RAZORPAY_WEBHOOK_SECRET"
          add_secret "google-client-id"                "$GOOGLE_CLIENT_ID"
          add_secret "google-client-secret"            "$GOOGLE_CLIENT_SECRET"
          add_secret "google-redirect-uri"             "$GOOGLE_REDIRECT_URI"
          add_secret "gmail-redirect-uri"              "$GMAIL_REDIRECT_URI"
          add_secret "ghcr-password"                   "$GHCR_PASSWORD"
          if [ ${#SECRETS[@]} -eq 0 ]; then
            echo "No secrets to seed into coachprod-shell, skipping."
          else
            az containerapp secret set \
              --name coachprod-shell \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --secrets "${SECRETS[@]}"
          fi

  # ---- Build and deploy multi-agent container ----
  deploy-agents:
    runs-on: ubuntu-latest
    needs: [changes, seed-secrets]
    if: needs.changes.outputs.agents == 'true' || github.event.inputs.force_agents == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-agent image
        run: |
          SHA="${{ github.sha }}"
          docker build \
            --build-arg AGENT_MODE=multi \
            -f Dockerfile.agent \
            -t ${{ env.REGISTRY }}/coaching-multi-agent:latest \
            -t ${{ env.REGISTRY }}/coaching-multi-agent:$SHA \
            .
          docker push ${{ env.REGISTRY }}/coaching-multi-agent:latest
          docker push ${{ env.REGISTRY }}/coaching-multi-agent:$SHA

      - name: Configure GHCR credentials on multi-agent Container App
        run: |
          az containerapp registry set \
            --name coachprod-multi \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server ghcr.io \
            --username ${{ github.repository_owner }} \
            --password ${{ secrets.GITHUB_TOKEN }}

      - name: Update multi-agent Container App
        run: |
          az containerapp update \
            --name coachprod-multi \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/coaching-multi-agent:latest

  # ---- Build and deploy shell ----
  deploy-shell:
    runs-on: ubuntu-latest
    needs: [changes, seed-secrets]
    if: needs.changes.outputs.shell == 'true' || github.event.inputs.force_shell == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push shell image
        run: |
          SHA="${{ github.sha }}"
          docker build \
            -t ${{ env.REGISTRY }}/shell:latest \
            -t ${{ env.REGISTRY }}/shell:$SHA \
            -f shell/Dockerfile \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            --build-arg PLATFORM_DOMAIN=${{ secrets.PLATFORM_DOMAIN }} \
            .
          docker push ${{ env.REGISTRY }}/shell:latest
          docker push ${{ env.REGISTRY }}/shell:$SHA

      - name: Configure GHCR credentials on shell Container App
        run: |
          az containerapp registry set \
            --name coachprod-shell \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server ghcr.io \
            --username ${{ github.repository_owner }} \
            --password ${{ secrets.GITHUB_TOKEN }}

      - name: Get multi-agent FQDN
        id: multi-agent
        run: |
          fqdn=$(az containerapp show \
            --name coachprod-multi \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query 'properties.configuration.ingress.fqdn' -o tsv 2>/dev/null || echo "")
          echo "fqdn=$fqdn" >> $GITHUB_OUTPUT

      - name: Update shell Container App
        run: |
          SHA="${{ github.sha }}"
          MULTI_AGENT_URL=""
          if [ -n "${{ steps.multi-agent.outputs.fqdn }}" ]; then
            MULTI_AGENT_URL="https://${{ steps.multi-agent.outputs.fqdn }}"
          fi
          az containerapp update \
            --name coachprod-shell \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/shell:$SHA \
            --set-env-vars \
              "MULTI_AGENT_MODE=true" \
              "MULTI_AGENT_BASE_URL=$MULTI_AGENT_URL"
