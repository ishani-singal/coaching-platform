name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_agents:
        description: 'Force rebuild agents even if no agent files changed'
        type: boolean
        default: false

env:
  REGISTRY: coachingplatformprod.azurecr.io
  RESOURCE_GROUP: coaching-platform-prod-rg
  LOCATION: centralus

jobs:
  # ── Detect which paths changed ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      agents: ${{ steps.filter.outputs.agents }}
      shell:  ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            agents:
              - 'packages/agents/**'
              - 'packages/sdk/**'
              - 'packages/tools/**'
              - 'packages/skills/**'
              - 'Dockerfile.agent'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
            shell:
              - 'shell/**'
              - 'packages/sdk/**'
              - 'packages/tools/**'
              - 'packages/skills/**'
              - 'shell/Dockerfile'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'

  # ── Shared ACR login helper (reused by both jobs via outputs) ───────────────
  acr-creds:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.agents == 'true' || needs.changes.outputs.shell == 'true' || github.event.inputs.force_agents == 'true'
    permissions:
      contents: read
      id-token: write
    outputs:
      username: ${{ steps.creds.outputs.username }}
      password: ${{ steps.creds.outputs.password }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Get ACR credentials
        id: creds
        run: |
          ACR_NAME=$(echo "${{ env.REGISTRY }}" | cut -d. -f1)
          echo "username=$(az acr credential show --name "$ACR_NAME" --query username -o tsv)" >> $GITHUB_OUTPUT
          echo "password=$(az acr credential show --name "$ACR_NAME" --query 'passwords[0].value' -o tsv)" >> $GITHUB_OUTPUT

  # ── Build & deploy agents (only when agent/shared packages change) ──────────
  deploy-agents:
    runs-on: ubuntu-latest
    needs: [changes, acr-creds]
    if: needs.changes.outputs.agents == 'true' || github.event.inputs.force_agents == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ needs.acr-creds.outputs.username }}
          password: ${{ needs.acr-creds.outputs.password }}

      - name: Build and push agent images
        run: |
          for agent in 01-program-builder 02-program-runner 03-coach-library 04-persona-chat 05-crm 06-licensing 07-payment; do
            docker build \
              -t ${{ env.REGISTRY }}/agents/$agent:latest \
              --build-arg AGENT_NAME=$agent \
              -f Dockerfile.agent \
              .
            docker push ${{ env.REGISTRY }}/agents/$agent:latest
          done

      - name: Update Container Apps with new images
        run: |
          for i in 01 02 03 04 05 06 07; do
            names=(program-builder program-runner coach-library persona-chat crm licensing payment)
            idx=$((10#$i - 1))
            az containerapp registry set \
              --name coachprod-$i \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --server ${{ env.REGISTRY }} \
              --username ${{ needs.acr-creds.outputs.username }} \
              --password ${{ needs.acr-creds.outputs.password }}
            az containerapp update \
              --name coachprod-$i \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY }}/agents/$i-${names[$idx]}:latest
          done

  # ── Build & deploy shell (only when shell/shared packages change) ───────────
  deploy-shell:
    runs-on: ubuntu-latest
    needs: [changes, acr-creds]
    if: needs.changes.outputs.shell == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ needs.acr-creds.outputs.username }}
          password: ${{ needs.acr-creds.outputs.password }}

      - name: Build and push shell image
        run: |
          SHA="${{ github.sha }}"
          docker build \
            -t ${{ env.REGISTRY }}/shell:latest \
            -t ${{ env.REGISTRY }}/shell:$SHA \
            -f shell/Dockerfile \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            .
          docker push ${{ env.REGISTRY }}/shell:latest
          docker push ${{ env.REGISTRY }}/shell:$SHA

      - name: Deploy Shell to App Service
        run: |
          SHA="${{ github.sha }}"
          ACR_USER="${{ needs.acr-creds.outputs.username }}"
          ACR_PASS="${{ needs.acr-creds.outputs.password }}"
          az webapp config container set \
            --name coaching-platform-prod-shell \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --container-image-name ${{ env.REGISTRY }}/shell:$SHA \
            --container-registry-url https://${{ env.REGISTRY }} \
            --container-registry-user "$ACR_USER" \
            --container-registry-password "$ACR_PASS"
          az webapp restart \
            --name coaching-platform-prod-shell \
            --resource-group ${{ env.RESOURCE_GROUP }}

      - name: Set agent URLs on App Service
        run: |
          set -e
          CONTAINER_APPS=(coachprod-01 coachprod-02 coachprod-03 coachprod-04 coachprod-05 coachprod-06 coachprod-07)
          ENV_KEYS=(AGENT_PROGRAM_BUILDER_URL AGENT_PROGRAM_RUNNER_URL AGENT_COACH_LIBRARY_URL AGENT_PERSONA_CHAT_URL AGENT_CRM_URL AGENT_LICENSING_URL AGENT_PAYMENT_URL)
          SETTINGS=()
          for i in "${!CONTAINER_APPS[@]}"; do
            fqdn=$(az containerapp show \
              --name "${CONTAINER_APPS[$i]}" \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query 'properties.configuration.ingress.fqdn' -o tsv 2>/dev/null || echo "")
            if [ -n "$fqdn" ]; then
              SETTINGS+=("${ENV_KEYS[$i]}=https://${fqdn}")
            fi
          done
          if [ ${#SETTINGS[@]} -gt 0 ]; then
            az webapp config appsettings set \
              --name coaching-platform-prod-shell \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --settings "${SETTINGS[@]}"
          fi

